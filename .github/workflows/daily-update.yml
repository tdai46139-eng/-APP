name: Daily Data Update

# 触发条件: 每天北京时间 08:00 (UTC 00:00) 自动运行
# 也可以在 GitHub 仓库页面手动点击 Run workflow 触发
on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:      # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - uses: actions/checkout@v4

      # 2. 安装 Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖
      - name: Install dependencies
        run: pip install -r trend-assistant/requirements.txt

      # 4. 运行数据管道
      - name: Run data pipeline
        run: python main.py
        working-directory: trend-assistant

      # 5. 把生成的 data.json 提交回仓库
      - name: Commit and push data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add trend-assistant/data.json
          git commit -m "Daily data update - $(date -u +'%Y-%m-%d %H:%M')"
          git push
